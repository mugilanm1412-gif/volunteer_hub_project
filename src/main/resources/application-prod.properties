# ============================================================================
# Volunteer Hub and Performance Tracking System - Production Configuration
# Profile: prod (Activate via -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod)
# ============================================================================

spring.application.name=volunteer-hub

# Server Port (Supports standard cloud PORT variable or SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Handle Reverse Proxy Headers (Nginx / Cloudflare / AWS ALB SSL Termination)
server.forward-headers-strategy=native

# ----------------------------------------------------------------------------
# Database Connection (Mandatory Environment Variables in Production)
# Note: Zero hardcoded fallbacks to prevent accidental insecure execution.
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Connection Pool Sizing
spring.datasource.hikari.pool-name=VolunteerHubHikariPool-Prod
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ----------------------------------------------------------------------------
# JPA / Hibernate Production Settings
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Flyway Database Migration
# Safety Rule: Target V1 schema only in production, preventing V2 dev sample data seeding.
# Set FLYWAY_TARGET=latest only if custom production seed scripts are added.
# ----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=${FLYWAY_TARGET:1}

# ----------------------------------------------------------------------------
# Session Management & Cookie Security (HTTPS Enforced)
# ----------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Optional CORS Allowed Origins for split frontend deployments (comma-separated URLs)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ----------------------------------------------------------------------------
# Background Services & Schedulers
# ----------------------------------------------------------------------------
app.mail.enabled=${MAIL_ENABLED:false}
app.scheduler.event-reminder-cron=${EVENT_REMINDER_CRON:0 0 8 * * ?}
app.scheduler.event-reminder-enabled=${EVENT_REMINDER_ENABLED:true}

# ----------------------------------------------------------------------------
# Production Structured Logging
# ----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.volunteerhub=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
