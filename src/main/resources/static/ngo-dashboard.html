<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Dashboard - Volunteer Hub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Dynamic Navigation Bar -->
  <nav id="app-nav" class="app-navbar"></nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="ngo-name-title">Organization Dashboard</h1>
        <p>Manage your published volunteering drives and review volunteer applications</p>
      </div>
      <div>
        <a href="/create-event.html" class="btn btn-primary">+ Create New Event</a>
      </div>
    </div>

    <!-- Verification Status Banner -->
    <div id="ngo-verification-banner" style="margin-bottom: 2rem;"></div>

    <!-- Published Events Section -->
    <div class="card">
      <div class="card-header">
        <h3 style="margin: 0; font-size: 1.2rem;">Our Published Events</h3>
        <span id="events-total-badge" class="badge badge-neutral">0 Events</span>
      </div>
      <div class="card-body" style="padding: 0;">
        <div id="events-table-container" class="table-responsive">
          <div style="text-align: center; padding: 3rem;">
            <span class="spinner" style="border-top-color: var(--primary-700);"></span>
            <p style="margin-top: 0.5rem; color: var(--neutral-500);">Loading your events...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p style="margin: 0; font-weight: 600;">Volunteer Hub &bull; Empowering Verified Impact</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await apiFetch('/api/users/me');
        if (user.role !== 'NGO') {
          showNotNgo();
          return;
        }

        const profile = await apiFetch('/api/ngos/me/profile');
        renderNgoStatus(profile);
        loadMyEvents();
      } catch (err) {
        window.location.href = '/login.html?redirect=/ngo-dashboard.html';
      }
    });

    function showNotNgo() {
      const container = document.getElementById('events-table-container');
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🏢</div>
          <h3>NGO Portal Access</h3>
          <p>This dashboard is reserved for registered non-profit organizations.</p>
          <a href="/login.html" class="btn btn-primary" style="margin-top: 1rem;">Log In as NGO</a>
        </div>
      `;
    }

    function renderNgoStatus(profile) {
      if (profile.name) {
        document.getElementById('ngo-name-title').textContent = profile.name;
      }

      const banner = document.getElementById('ngo-verification-banner');
      if (profile.verificationStatus === 'VERIFIED') {
        banner.innerHTML = `
          <div class="alert alert-success" style="margin: 0; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <strong>Verified Organization ✓</strong>
              <div style="font-size: 0.85rem; margin-top: 0.2rem;">Your credentials are confirmed. You have full publishing authorization.</div>
            </div>
            <span class="badge badge-success">VERIFIED</span>
          </div>
        `;
      } else if (profile.verificationStatus === 'REJECTED') {
        banner.innerHTML = `
          <div class="alert alert-danger" style="margin: 0;">
            <strong>Verification Declined:</strong>
            <div style="font-size: 0.85rem; margin-top: 0.2rem;">Reason: "${escapeHtml(profile.rejectionReason || 'Incomplete registration documents')}". Please update your profile or contact administration.</div>
          </div>
        `;
      } else {
        banner.innerHTML = `
          <div class="alert alert-warning" style="margin: 0; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <strong>Pending Administrator Verification:</strong>
              <div style="font-size: 0.85rem; margin-top: 0.2rem;">Your account is currently under administrative review. You can create drafts while awaiting verification.</div>
            </div>
            <span class="badge badge-warning">PENDING</span>
          </div>
        `;
      }
    }

    async function loadMyEvents() {
      const container = document.getElementById('events-table-container');
      const badge = document.getElementById('events-total-badge');

      try {
        const data = await apiFetch('/api/events/mine?size=50');
        badge.textContent = `${data.totalElements} Event${data.totalElements === 1 ? '' : 's'}`;

        if (!data.content || data.content.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🌱</div>
              <h3>No Events Created Yet</h3>
              <p>Get started by publishing your first community initiative.</p>
              <a href="/create-event.html" class="btn btn-primary" style="margin-top: 1rem;">+ Create Event</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Event Title</th>
                <th>Category</th>
                <th>Date & Time</th>
                <th>Capacity & Slots</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.content.map(ev => {
                let badgeClass = 'badge-success';
                if (ev.status === 'CANCELLED') badgeClass = 'badge-danger';
                else if (ev.status === 'COMPLETED') badgeClass = 'badge-neutral';
                else if (ev.status === 'DRAFT') badgeClass = 'badge-warning';

                const eventDate = new Date(ev.eventDate + 'T00:00:00').toLocaleDateString(undefined, {
                  month: 'short', day: 'numeric', year: 'numeric'
                });

                const approved = ev.approvedCount || 0;
                const capacity = ev.capacity || 1;

                return `
                  <tr>
                    <td>
                      <div style="font-weight: 700;">
                        <a href="/event-details.html?id=${ev.id}" style="color: var(--neutral-900);">
                          ${escapeHtml(ev.title)}
                        </a>
                      </div>
                      <div style="font-size: 0.8rem; color: var(--neutral-500);">
                        ${escapeHtml(ev.location)}
                      </div>
                    </td>
                    <td>
                      <span class="badge badge-info">${escapeHtml(ev.category || 'General')}</span>
                    </td>
                    <td style="font-size: 0.85rem;">
                      <div>${eventDate}</div>
                      <div style="color: var(--neutral-500);">${ev.startTime ? ev.startTime.substring(0, 5) : ''} - ${ev.endTime ? ev.endTime.substring(0, 5) : ''}</div>
                    </td>
                    <td>
                      <div style="font-weight: 600; font-size: 0.9rem;">
                        ${approved} / ${capacity} approved
                      </div>
                      <div style="font-size: 0.75rem; color: var(--neutral-500);">
                        ${Math.max(0, capacity - approved)} spots open
                      </div>
                    </td>
                    <td>
                      <span class="badge ${badgeClass}">${ev.status}</span>
                    </td>
                    <td style="text-align: right;">
                      <div style="display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap;">
                        <a href="/attendance-management.html?eventId=${ev.id}" class="btn btn-primary btn-sm">
                          Attendance
                        </a>
                        <a href="/event-details.html?id=${ev.id}" class="btn btn-outline btn-sm">
                          Applicants
                        </a>
                        <a href="/create-event.html?id=${ev.id}" class="btn btn-secondary btn-sm">
                          Edit
                        </a>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger" style="margin: 1.5rem;">
            Failed to load your events: ${escapeHtml(err.message)}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
