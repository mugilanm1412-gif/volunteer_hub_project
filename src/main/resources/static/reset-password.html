<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Volunteer Hub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <nav id="app-nav" class="app-navbar"></nav>

  <main class="main-content" style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="box-shadow: var(--shadow-lg);">
      <div class="card-header" style="text-align: center; display: block; padding: 2rem 2rem 1rem 2rem;">
        <h2 style="font-size: 1.65rem;">Set New Password</h2>
        <p style="color: var(--neutral-500); margin-top: 0.25rem;">Enter your new secure account password</p>
      </div>

      <div class="card-body" style="padding: 1.5rem 2rem 2rem 2rem;">
        <div id="alert-container"></div>

        <form id="reset-form" novalidate>
          <div class="form-group" id="token-group">
            <label class="form-label required" for="token">Reset Token</label>
            <input type="text" id="token" class="form-control" placeholder="Token from reset link" required>
            <span id="token-error" class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label required" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-control" placeholder="Minimum 8 characters" required>
            <span id="password-error" class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label required" for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password" required>
            <span id="confirm-error" class="form-error"></span>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
            <span>Save New Password</span>
          </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--neutral-600);">
          <a href="/login.html" style="font-weight: 600;">Return to Log In</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p style="margin: 0; font-size: 0.85rem;">Volunteer Hub &bull; Final Year Evaluation Ready</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenInput = document.getElementById('token');
      const tokenGroup = document.getElementById('token-group');

      const urlToken = urlParams.get('token');
      if (urlToken) {
        tokenInput.value = urlToken;
        tokenGroup.style.display = 'none'; // Pre-filled from link
      }

      const form = document.getElementById('reset-form');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submit-btn');
      const alertContainer = document.getElementById('alert-container');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';
        document.getElementById('token-error').textContent = '';
        document.getElementById('password-error').textContent = '';
        document.getElementById('confirm-error').textContent = '';

        const token = tokenInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        let hasError = false;
        if (!token) {
          tokenGroup.style.display = 'block';
          document.getElementById('token-error').textContent = 'Reset token is required';
          hasError = true;
        }
        if (!newPassword || newPassword.length < 8) {
          document.getElementById('password-error').textContent = 'Password must be at least 8 characters long';
          hasError = true;
        }
        if (newPassword !== confirmPassword) {
          document.getElementById('confirm-error').textContent = 'Passwords do not match';
          hasError = true;
        }
        if (hasError) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Updating...';

        try {
          const res = await apiFetch('/api/auth/reset-password', {
            method: 'POST',
            body: { token, newPassword }
          });

          form.style.display = 'none';
          alertContainer.innerHTML = `
            <div class="alert alert-success" style="display: block;">
              <h4 style="margin-bottom: 0.5rem; color: var(--success-text);">Password Reset Successfully!</h4>
              <p style="margin: 0; font-size: 0.95rem;">${escapeHtml(res.message)}</p>
              <div style="margin-top: 1.25rem;">
                <a href="/login.html" class="btn btn-primary btn-block">Log In Now</a>
              </div>
            </div>
          `;
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Save New Password</span>';
          alertContainer.innerHTML = `
            <div class="alert alert-danger">
              ${escapeHtml(err.message || 'Failed to reset password. The token may be expired or already used.')}
            </div>
          `;
        }
      });
    });
  </script>
</body>
</html>
