<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Volunteer Hub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <nav id="app-nav" class="app-navbar"></nav>

  <main class="main-content" style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="box-shadow: var(--shadow-lg);">
      <div class="card-header" style="text-align: center; display: block; padding: 2rem 2rem 1rem 2rem;">
        <h2 style="font-size: 1.65rem;">Reset Your Password</h2>
        <p style="color: var(--neutral-500); margin-top: 0.25rem;">Enter your email to receive a recovery link</p>
      </div>

      <div class="card-body" style="padding: 1.5rem 2rem 2rem 2rem;">
        <div id="alert-container"></div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label required" for="email">Account Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
            <span id="email-error" class="form-error"></span>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
            <span>Send Reset Link</span>
          </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--neutral-600);">
          Remember your password? <a href="/login.html" style="font-weight: 600;">Back to Log In</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p style="margin: 0; font-size: 0.85rem;">Volunteer Hub &bull; Final Year Evaluation Ready</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');
      const alertContainer = document.getElementById('alert-container');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';
        document.getElementById('email-error').textContent = '';

        const email = emailInput.value.trim();
        if (!email) {
          document.getElementById('email-error').textContent = 'Please enter your registered email address';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Dispatching...';

        try {
          const res = await apiFetch('/api/auth/forgot-password', {
            method: 'POST',
            body: { email }
          });

          form.style.display = 'none';
          alertContainer.innerHTML = `
            <div class="alert alert-success" style="display: block;">
              <h4 style="margin-bottom: 0.5rem; color: var(--success-text);">Check Your Inbox</h4>
              <p style="margin: 0; font-size: 0.95rem;">${escapeHtml(res.message)}</p>
              <div style="margin-top: 1rem; font-size: 0.85rem; color: var(--neutral-600); background: #ffffff; padding: 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--neutral-200);">
                <strong>Developer Note:</strong> When email sending is disabled in development, the reset link is logged directly to the application server terminal.
              </div>
            </div>
          `;
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Send Reset Link</span>';
          alertContainer.innerHTML = `
            <div class="alert alert-danger">
              ${escapeHtml(err.message || 'Unable to process reset request. Please try again.')}
            </div>
          `;
        }
      });
    });
  </script>
</body>
</html>
