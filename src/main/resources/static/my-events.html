<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registered Events - Volunteer Hub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Dynamic Navigation Bar -->
  <nav id="app-nav" class="app-navbar"></nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>My Volunteering Schedule</h1>
        <p>Track your registered initiatives, approval status, and upcoming drives.</p>
      </div>
      <div>
        <a href="/events.html" class="btn btn-primary btn-sm">Explore More Opportunities</a>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="upcoming" onclick="switchTab('upcoming')">
        Upcoming
      </button>
      <button class="tab-btn" data-tab="pending" onclick="switchTab('pending')">
        Pending Review
      </button>
      <button class="tab-btn" data-tab="completed" onclick="switchTab('completed')">
        Past & Completed
      </button>
      <button class="tab-btn" data-tab="all" onclick="switchTab('all')">
        All Registrations
      </button>
    </div>

    <!-- Applications Container -->
    <div id="applications-container">
      <div style="text-align: center; padding: 3rem;">
        <span class="spinner" style="border-top-color: var(--primary-700);"></span>
        <p style="margin-top: 0.5rem; color: var(--neutral-500);">Loading your events...</p>
      </div>
    </div>

    <!-- Pagination Controls -->
    <div id="pagination-controls" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem;"></div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p style="margin: 0; font-weight: 600;">Volunteer Hub &bull; Empowering Verified Impact</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    let currentTab = 'upcoming';
    let currentPage = 0;
    const pageSize = 10;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await apiFetch('/api/users/me');
        if (user.role !== 'VOLUNTEER') {
          showNotVolunteer();
          return;
        }
      } catch (err) {
        window.location.href = '/login.html?redirect=/my-events.html';
        return;
      }

      loadApplications(currentTab, 0);
    });

    function showNotVolunteer() {
      const container = document.getElementById('applications-container');
      container.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3>Volunteer Account Required</h3>
            <p>The "My Events" schedule tracks applications submitted by registered volunteers.</p>
            <a href="/events.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Opportunities</a>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      loadApplications(tab, 0);
    }

    async function loadApplications(tab, page) {
      currentPage = page;
      const container = document.getElementById('applications-container');

      try {
        const data = await apiFetch(`/api/volunteers/me/applications?tab=${tab}&page=${page}&size=${pageSize}`);

        if (!data.content || data.content.length === 0) {
          container.innerHTML = `
            <div class="card">
              <div class="empty-state">
                <div class="empty-state-icon">📅</div>
                <h3>${getEmptyTitle(tab)}</h3>
                <p>${getEmptySubtitle(tab)}</p>
                <a href="/events.html" class="btn btn-outline btn-sm" style="margin-top: 0.75rem;">
                  Discover Open Opportunities
                </a>
              </div>
            </div>
          `;
          document.getElementById('pagination-controls').innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            ${data.content.map(renderApplicationCard).join('')}
          </div>
        `;

        renderPagination(data.totalPages, data.page);
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger">
            Failed to load registrations: ${escapeHtml(err.message)}
          </div>
        `;
      }
    }

    function renderApplicationCard(app) {
      let badgeClass = 'badge-warning';
      if (app.status === 'APPROVED') badgeClass = 'badge-success';
      else if (app.status === 'REJECTED') badgeClass = 'badge-danger';
      else if (app.status === 'CANCELLED') badgeClass = 'badge-neutral';

      const eventDate = app.eventDate
        ? new Date(app.eventDate + 'T00:00:00').toLocaleDateString(undefined, {
            weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
          })
        : 'Date not set';

      const timeRange = app.startTime && app.endTime
        ? `${app.startTime.substring(0, 5)} - ${app.endTime.substring(0, 5)}`
        : '';

      const canCancel = (app.status === 'PENDING' || app.status === 'APPROVED') &&
                        (!app.eventDate || new Date(app.eventDate + 'T00:00:00') >= new Date());

      return `
        <div class="card">
          <div class="card-body" style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 280px;">
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem;">
                <span class="badge ${badgeClass}">${app.status}</span>
                <span style="font-size: 0.85rem; color: var(--primary-700); font-weight: 600;">
                  ${escapeHtml(app.ngoName || 'NGO Initiative')}
                </span>
              </div>

              <h3 style="font-size: 1.35rem; margin-bottom: 0.5rem;">
                <a href="/event-details.html?id=${app.eventId}" style="color: var(--neutral-900);">
                  ${escapeHtml(app.eventTitle || 'Volunteering Event')}
                </a>
              </h3>

              <div class="event-meta" style="margin: 0.5rem 0 0 0;">
                <div class="event-meta-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  <span>${eventDate}${timeRange ? ` &bull; ${timeRange}` : ''}</span>
                </div>
                <div class="event-meta-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                  <span>${escapeHtml(app.location || 'Location details')}</span>
                </div>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
              <a href="/event-details.html?id=${app.eventId}" class="btn btn-outline btn-sm">
                View Event Page
              </a>
              ${canCancel ? `
                <button class="btn btn-secondary btn-sm" style="color: #dc2626;" onclick="cancelRegistration(${app.id})">
                  Cancel Registration
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    async function cancelRegistration(appId) {
      if (!confirm('Are you sure you want to cancel this registration?')) {
        return;
      }

      try {
        await apiFetch(`/api/applications/${appId}/cancel`, { method: 'POST' });
        showToast('Registration cancelled', 'info');
        loadApplications(currentTab, currentPage);
      } catch (err) {
        showToast(err.message || 'Failed to cancel registration', 'danger');
      }
    }

    function getEmptyTitle(tab) {
      if (tab === 'upcoming') return 'No Upcoming Events';
      if (tab === 'pending') return 'No Pending Applications';
      if (tab === 'completed') return 'No Completed Initiatives';
      return 'No Applications Found';
    }

    function getEmptySubtitle(tab) {
      if (tab === 'upcoming') return 'You do not have any confirmed upcoming drives on your schedule.';
      if (tab === 'pending') return 'You do not have any applications awaiting NGO organizer review.';
      if (tab === 'completed') return 'Completed volunteering sessions and attendance hours will appear here.';
      return 'You haven’t registered for any volunteering initiatives yet.';
    }

    function renderPagination(totalPages, page) {
      const container = document.getElementById('pagination-controls');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      if (page > 0) {
        html += `<button class="btn btn-secondary btn-sm" onclick="loadApplications('${currentTab}', ${page - 1})">Previous</button>`;
      }
      html += `<span style="font-size: 0.9rem; color: var(--neutral-600); font-weight: 500; align-self: center;">Page ${page + 1} of ${totalPages}</span>`;
      if (page < totalPages - 1) {
        html += `<button class="btn btn-secondary btn-sm" onclick="loadApplications('${currentTab}', ${page + 1})">Next</button>`;
      }
      container.innerHTML = html;
    }
  </script>
</body>
</html>
