<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Volunteering Opportunities - Volunteer Hub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Dynamic Navigation Bar -->
  <nav id="app-nav" class="app-navbar"></nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Explore Opportunities</h1>
        <p>Discover verified community drives, environmental actions, and volunteer initiatives.</p>
      </div>
      <div id="ngo-create-action" style="display: none;">
        <a href="/create-event.html" class="btn btn-primary">+ Create New Event</a>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-card">
      <form id="filter-form">
        <div class="filter-grid">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="filter-q">Search</label>
            <input type="text" id="filter-q" class="form-control" placeholder="Keywords, titles...">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="filter-category">Category</label>
            <select id="filter-category" class="form-select">
              <option value="">All Categories</option>
              <option value="Environment">Environment</option>
              <option value="Education">Education</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Community Aid">Community Aid</option>
              <option value="Animal Welfare">Animal Welfare</option>
              <option value="Disaster Relief">Disaster Relief</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="filter-location">Location</label>
            <input type="text" id="filter-location" class="form-control" placeholder="City, park, area...">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="filter-from">From Date</label>
            <input type="date" id="filter-from" class="form-control">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="filter-to">To Date</label>
            <input type="date" id="filter-to" class="form-control">
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; gap: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.95rem; font-weight: 500; color: var(--neutral-700);">
            <input type="checkbox" id="filter-hasSlots" style="width: 1.1rem; height: 1.1rem; accent-color: var(--primary-700);">
            Show only events with available spots
          </label>

          <div style="display: flex; gap: 0.75rem;">
            <button type="button" id="btn-reset-filters" class="btn btn-secondary btn-sm">Reset</button>
            <button type="submit" class="btn btn-primary btn-sm">Apply Filters</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Results Header / Total elements -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
      <span id="results-count" style="font-size: 0.95rem; color: var(--neutral-600); font-weight: 500;">
        Loading opportunities...
      </span>
    </div>

    <!-- Events Grid -->
    <div id="events-container">
      <div style="text-align: center; padding: 3rem;">
        <span class="spinner" style="border-top-color: var(--primary-700);"></span>
        <p style="margin-top: 0.5rem; color: var(--neutral-500);">Searching events...</p>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination-controls" style="display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 2.5rem;"></div>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p style="margin: 0; font-weight: 600;">Volunteer Hub &bull; Empowering Verified Impact</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    let currentPage = 0;
    const pageSize = 9;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check user role for quick "+ Create New Event" button
      try {
        const user = await apiFetch('/api/users/me');
        if (user && user.role === 'NGO') {
          const createActionEl = document.getElementById('ngo-create-action');
          if (createActionEl) createActionEl.style.display = 'block';
        }
      } catch (e) {
        // Unauthenticated visitor
      }

      // Prepopulate form from URL search params if present
      const params = new URLSearchParams(window.location.search);
      if (params.get('q')) document.getElementById('filter-q').value = params.get('q');
      if (params.get('category')) document.getElementById('filter-category').value = params.get('category');
      if (params.get('location')) document.getElementById('filter-location').value = params.get('location');
      if (params.get('from')) document.getElementById('filter-from').value = params.get('from');
      if (params.get('to')) document.getElementById('filter-to').value = params.get('to');
      if (params.get('hasSlots') === 'true') document.getElementById('filter-hasSlots').checked = true;

      // Event listeners
      document.getElementById('filter-form').addEventListener('submit', (e) => {
        e.preventDefault();
        loadEvents(0);
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        document.getElementById('filter-q').value = '';
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-location').value = '';
        document.getElementById('filter-from').value = '';
        document.getElementById('filter-to').value = '';
        document.getElementById('filter-hasSlots').checked = false;
        loadEvents(0);
      });

      loadEvents(0);
    });

    async function loadEvents(page) {
      currentPage = page;
      const container = document.getElementById('events-container');
      const countEl = document.getElementById('results-count');

      const q = document.getElementById('filter-q').value.trim();
      const category = document.getElementById('filter-category').value;
      const location = document.getElementById('filter-location').value.trim();
      const from = document.getElementById('filter-from').value;
      const to = document.getElementById('filter-to').value;
      const hasSlots = document.getElementById('filter-hasSlots').checked;

      const queryParams = new URLSearchParams();
      if (q) queryParams.set('q', q);
      if (category) queryParams.set('category', category);
      if (location) queryParams.set('location', location);
      if (from) queryParams.set('from', from);
      if (to) queryParams.set('to', to);
      if (hasSlots) queryParams.set('hasSlots', 'true');
      queryParams.set('page', page);
      queryParams.set('size', pageSize);

      try {
        const data = await apiFetch(`/api/events?${queryParams.toString()}`);
        const total = data.totalElements;

        countEl.textContent = `Showing ${data.content.length} of ${total} upcoming event${total === 1 ? '' : 's'}`;

        if (!data.content || data.content.length === 0) {
          container.innerHTML = `
            <div class="card">
              <div class="empty-state">
                <div class="empty-state-icon">🌱</div>
                <h3>No Matching Events Found</h3>
                <p>Try adjusting your search filters or check back later for newly published initiatives.</p>
              </div>
            </div>
          `;
          document.getElementById('pagination-controls').innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div class="event-grid">
            ${data.content.map(renderEventCard).join('')}
          </div>
        `;

        renderPagination(data.totalPages, data.page);
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger">
            Error loading events: ${escapeHtml(err.message)}
          </div>
        `;
        countEl.textContent = 'Error loading events';
      }
    }

    function renderEventCard(ev) {
      const remaining = ev.remainingSlots !== undefined ? ev.remainingSlots : Math.max(0, ev.capacity - (ev.approvedCount || 0));
      const isFull = remaining <= 0;
      const slotBadge = isFull
        ? `<span class="badge badge-danger">Event Full</span>`
        : `<span class="badge badge-success">${remaining} spot${remaining === 1 ? '' : 's'} remaining</span>`;

      const formattedDate = new Date(ev.eventDate + 'T00:00:00').toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
      });

      const timeRange = ev.startTime && ev.endTime
        ? `${ev.startTime.substring(0, 5)} - ${ev.endTime.substring(0, 5)}`
        : '';

      return `
        <div class="card event-card">
          <div class="card-body">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.75rem;">
              <span class="badge badge-info">${escapeHtml(ev.category || 'General')}</span>
              ${slotBadge}
            </div>

            <h3 style="font-size: 1.25rem; margin-bottom: 0.4rem; color: var(--neutral-900);">
              <a href="/event-details.html?id=${ev.id}" style="color: inherit; text-decoration: none;">
                ${escapeHtml(ev.title)}
              </a>
            </h3>

            <p style="font-size: 0.85rem; color: var(--primary-700); font-weight: 600; margin-bottom: 0.75rem;">
              By ${escapeHtml(ev.ngoName || 'Verified Organization')}
            </p>

            <div class="event-meta">
              <div class="event-meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>${formattedDate}${timeRange ? ` &bull; ${timeRange}` : ''}</span>
              </div>
              <div class="event-meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(ev.location)}</span>
              </div>
            </div>

            <p style="font-size: 0.9rem; color: var(--neutral-600); line-height: 1.5; margin-bottom: 1.25rem; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              ${escapeHtml(ev.description || '')}
            </p>

            <div style="margin-top: auto; pt: 1rem; border-top: 1px solid var(--neutral-100); padding-top: 0.85rem;">
              <a href="/event-details.html?id=${ev.id}" class="btn btn-outline btn-sm btn-block">
                View Details & Register
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function renderPagination(totalPages, page) {
      const container = document.getElementById('pagination-controls');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      if (page > 0) {
        html += `<button class="btn btn-secondary btn-sm" onclick="loadEvents(${page - 1})">Previous</button>`;
      }
      html += `<span style="font-size: 0.9rem; color: var(--neutral-600); font-weight: 500;">Page ${page + 1} of ${totalPages}</span>`;
      if (page < totalPages - 1) {
        html += `<button class="btn btn-secondary btn-sm" onclick="loadEvents(${page + 1})">Next</button>`;
      }
      container.innerHTML = html;
    }
  </script>
</body>
</html>
