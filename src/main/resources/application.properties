# ============================================================================
# Volunteer Hub and Performance Tracking System: Configuration
# ============================================================================
spring.application.name=volunteer-hub

# Server Port
server.port=${SERVER_PORT:8080}

# Database Connection (Environment variables with safe local developer defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:volunteer_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false}
spring.datasource.username=${DB_USERNAME:vh_app}
spring.datasource.password=${DB_PASSWORD:vh_secret_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
# Architecture Rule: Never use ddl-auto=update; use ddl-auto=validate to let Flyway manage DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Mail Service Settings (Disabled by default in dev; logs reset links to console)
app.mail.enabled=${MAIL_ENABLED:false}

# Event Reminder Scheduler
app.scheduler.event-reminder-cron=${EVENT_REMINDER_CRON:0 0 8 * * ?}
app.scheduler.event-reminder-enabled=${EVENT_REMINDER_ENABLED:true}

